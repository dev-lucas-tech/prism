spring:
  application:
    name: prism
  datasource:
    url: jdbc:h2:mem:prism;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
server:
  port: 8080
prism:
  ai:
    api-key: ${OPENROUTER_API_KEY:}
    model: anthropic/claude-sonnet-4.5
    base-url: https://openrouter.ai/api/v1
    max-rounds: 6
    max-tokens: 1024
    connect-timeout-ms: 10000
    read-timeout-ms: 60000
