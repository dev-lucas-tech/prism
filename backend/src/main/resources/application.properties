spring.application.name=prism

spring.datasource.url=jdbc:h2:mem:prism;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true

server.port=8080

prism.ai.api-key=${OPENROUTER_API_KEY:}
prism.ai.model=openai/gpt-4o-mini
prism.ai.base-url=https://openrouter.ai/api/v1
prism.ai.max-rounds=6
prism.ai.max-tokens=1024
prism.ai.connect-timeout-ms=10000
prism.ai.read-timeout-ms=60000
